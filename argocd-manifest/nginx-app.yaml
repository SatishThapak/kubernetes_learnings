apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SatishThapak/kubernetes_learnings.git
    targetRevision: HEAD              # branch to track
    path: nginx-deploy                # folder with nginx-app.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd                # target namespace for nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
