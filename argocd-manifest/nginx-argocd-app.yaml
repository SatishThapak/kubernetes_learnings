apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-app
  namespace: argocd-nginx
spec:
  project: default
  source:
    repoURL: 'https://github.com/SatishThapak/kubernetes_learnings.git'
    targetRevision: HEAD
    path: nginx-deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
